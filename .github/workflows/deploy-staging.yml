name: Deploy staging

on:
  push:
    branches: [developer]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          envs: GITHUB_TOKEN
          script: |
            set -euo pipefail
            APP_DIR="/opt/fitcity/app"
            if [ -n "${{ secrets.VPS_STAGING_APP_PATH }}" ]; then APP_DIR="${{ secrets.VPS_STAGING_APP_PATH }}"; fi
            if [ -n "${{ secrets.VPS_APP_PATH }}" ] && [ -z "${{ secrets.VPS_STAGING_APP_PATH }}" ]; then APP_DIR="${{ secrets.VPS_APP_PATH }}"; fi
            DEPLOY_BRANCH="developer"
            REPO="Interlinkjsc/Fitcity"
            GIT_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
            if [ ! -d "${APP_DIR}/.git" ]; then
              mkdir -p "$(dirname "${APP_DIR}")"
              git clone -b "${DEPLOY_BRANCH}" "${GIT_URL}" "${APP_DIR}"
            fi
            cd "${APP_DIR}"
            git remote set-url origin "${GIT_URL}"
            git fetch origin
            git checkout "${DEPLOY_BRANCH}"
            git reset --hard "origin/${DEPLOY_BRANCH}"
            git clean -fd
            docker compose -f deploy/docker/docker-compose.yml up -d --build
            curl -sf http://127.0.0.1:3000/health || (docker compose -f deploy/docker/docker-compose.yml logs --tail=50 app; exit 1)
