name: CI

on:
  push:
    branches: [main, master, developer]
  pull_request:
    branches: [main, master, developer]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (CI gate)
        run: npm run test:ci
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/Fitcity_Test
          SESSION_SECRET: ci_session_secret_32_chars_min
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
          QR_HMAC_SECRET: ci_qr_hmac_secret_for_tests
