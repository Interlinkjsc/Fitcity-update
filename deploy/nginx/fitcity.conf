# Nginx site — copy to /etc/nginx/sites-available/fitcity
# Replace YOUR_DOMAIN, then: sudo ln -s .../fitcity /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx
# TLS: sudo apt install certbot python3-certbot-nginx && sudo certbot --nginx -d YOUR_DOMAIN

upstream fitcity_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    client_max_body_size 25M;

    location / {
        proxy_pass http://fitcity_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
